apply plugin: 'com.android.application'

// Opt-in staging build: ./gradlew assembleDebug -PagroStaging (see scripts/staging/build-staging-apk.sh).
// Without the property the build is exactly the production configuration.
def agroStaging = project.hasProperty('agroStaging')

android {
    namespace = "com.agroconnect.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agroconnect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLabel: "@string/app_name", activityLabel: "@string/title_activity_main"]
        if (agroStaging) {
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            manifestPlaceholders = [appLabel: "AgroConnect Staging", activityLabel: "AgroConnect Staging"]
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main {
            if (agroStaging) {
                // staging web bundle prepared by scripts/staging/build-staging-apk.sh (git-ignored build dir)
                assets.srcDirs = ['build/staging-assets']
            }
        }
    }
    // Release signing comes from ~/.gradle/gradle.properties on the build machine, never from the repository:
    //   AGRO_RELEASE_STORE_FILE, AGRO_RELEASE_STORE_PASSWORD, AGRO_RELEASE_KEY_ALIAS, AGRO_RELEASE_KEY_PASSWORD.
    // Use the same keystore that signed the installed v1.0, or phones cannot update.
    def hasReleaseKey = project.hasProperty('AGRO_RELEASE_STORE_FILE')
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(AGRO_RELEASE_STORE_FILE)
                storePassword AGRO_RELEASE_STORE_PASSWORD
                keyAlias AGRO_RELEASE_KEY_ALIAS
                keyPassword AGRO_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
